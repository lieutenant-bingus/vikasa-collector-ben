name: Release Please

# Automated release cadence. On every push to main, release-please maintains a
# standing "release PR" that bumps the version and updates CHANGELOG.md from the
# Conventional Commits since the last release. Merging that PR tags vX.Y.Z and
# creates the GitHub Release.
#
# Version policy (pre-1.0): feat -> minor, fix -> patch, breaking -> minor
# (bump-minor-pre-major). Config in release-please-config.json; current
# version tracked in .release-please-manifest.json.

on:
  push:
    branches: [main]

# Read-only by default; the job elevates to exactly what it needs.
permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the release + tag
      pull-requests: write   # open/maintain the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Attach linux/amd64 and linux/arm64 binaries to the release release-please
  # just created. In this workflow, not one triggered by the tag: a tag pushed
  # with the default GITHUB_TOKEN triggers no other workflow.
  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # upload assets to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
