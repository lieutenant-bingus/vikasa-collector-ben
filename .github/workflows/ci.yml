name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref; the suite is fast and green-per-commit
# matters more than a complete history of intermediate pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth: the go directive in go.mod.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # vet + golangci-lint (gofmt included) + tidy/verify + race tests +
      # boundary lint + its selftests + docs lint. One entry point, so CI and
      # a contributor's `make check` cannot disagree.
      - name: make check
        run: |
          go version
          make check

      # The binary ships to linux/arm64 and linux/amd64 cabinets; a host-only
      # build would not catch a platform-specific break.
      - name: cross-compile
        run: make cross

      # The release config is only exercised when a release is cut; check it
      # on every change so a broken one is caught here, not at release time.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check
