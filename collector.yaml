# Example collector configuration.
#
# Every value here is validated at boot and the collector refuses to start on
# anything it does not understand: unknown vendor/device_kind, malformed
# connection block, or tenant tokens that could corrupt subject grammar
# (ADR 0014 — config is the trust boundary).
#
# Field-by-field reference — types, defaults, validation:
#   docs/reference/configuration.md

# Tenant identity. region/agency/agency_unit are the OpenITS profile's identity
# triple and appear in the CloudEvent source URN on every event:
#
#   urn:openits:<entity-kind>:<region>:<agency>:<agency_unit>:<device-id>
#
# site is NOT in the URN. It stays because the collector still uses it for
# stream naming and health context, and because a device-less event (the boot
# event) needs an id for the collector itself.
#
# A dot would corrupt the subject and a colon would corrupt the URN, so both
# are rejected at boot rather than producing events nobody can route or parse.
# Note the source URN is load-bearing beyond routing: ce-id is derived from
# its literal bytes, so changing any of these values changes the id of every
# event published after.
region: us-ga
agency: metro-atlanta
agency_unit: d01
site: cabinet-042

# Identifies THIS collector as the OBSERVER of the events it publishes. Stamped
# into every openits payload's `observed-by`, the field that distinguishes "the
# device reported this" from "a poller inferred it by diffing consecutive
# reads" — which is what the collector actually does for mode, plan and fault
# transitions.
#
# Required, and deliberately has no default. Deriving it from agency/site would
# be silently wrong the moment a cabinet runs two collectors, and the mistake
# would surface as mislabelled provenance in the data lake rather than as a
# refusal to start.
collector_id: cabinet-042-collector

# Selects the wire emitter at boot — the ONE place a models version appears.
# One catalog version per collector instance (ADR 0005); version coexistence
# happens across the fleet, never inside one process.
#
# NOTE: the openits-models emitter is wired, but this value does not yet select
# between versions — there is only one emitter package while the models pin is
# lockstep (ADR 0010). It is validated as non-empty so the config contract is
# already the one version coexistence will need.
model_version: openits/v1

# Subject grammar is yours (ADR 0009). Omit this block entirely and you get the
# OpenITS NATS profile's seven-token grammar, which is what the profile's
# conformance harness asserts:
#
#   subject:
#     template: "{namespace}.{region}.{agency}.{agency_unit}.{service}.{device_id}.{event}"
#
# `{namespace}` is the ce-type's own first token, which roots each event family
# in its own subject space: `openits` for ITS catalog events,
# `openits-collector` for the collector's own health. The collector provisions
# ONE STREAM PER ROOT — OPENITS-<REGION>-<AGENCY>-<UNIT> and
# OPENITS-COLLECTOR-<REGION>-<AGENCY>-<UNIT> — so the two families can carry
# different retention, and so an operator can grant read access to traffic
# telemetry without also exposing collector internals (ADR 0011).
#
# Placeholders split into instance-constants (`vars`, plus the tenant identity
# fields) and per-event values decomposed from the ce-type. Device-less events
# (the boot event) render `device_id` as the literal "collector", so every
# event the collector can emit has a legal subject and the token count never
# varies.
#
# Note there is no `{version}` in the default: the ce-type already carries the
# major version, and repeating it here would be a second source of truth free
# to disagree with the first. `{version}` stays available if you want it.
#
# Reserved names cannot be redefined in vars (full list in
# docs/reference/configuration.md) — an operator var shadowing one would
# produce subjects that disagree with the collector's own identity, and it
# would surface as unroutable events rather than a config error.
#
# Rule of thumb: COARSEST, MOST STABLE TOKENS LEFTMOST. NATS makes prefix
# matching cheap — the JetStream stream binding, subject permissions, and
# upstream aggregation all key off the left of the subject. The binding is
# derived by truncating at the first per-event token, so with the default
# grammar that yields one binding per root:
# `openits.<region>.<agency>.<agency_unit>.>` and
# `openits-collector.<region>.<agency>.<agency_unit>.>`.
#
# Stream names are DERIVED from those bindings, not configured: with a stream
# per root a single `stream:` value would be meaningless, and a per-root block
# would be a second source of truth free to drift from the filters it names.
#
#   Service-first / flat ({prefix}.{service}...) — REJECTED AT BOOT. A cabinet
#     publishes across every service, so there is no static prefix to bind a
#     stream on and the binding would capture every subject on the server.
#
# Two warnings: adding or removing a token silently breaks subscribers whose
# wildcards encoded the old depth, so choose depth up front; and changing the
# grammar of a running cabinet generally means provisioning a new stream,
# because the binding is derived from the template.
#
# subject:
#   template: "{namespace}.{region}.{agency}.{agency_unit}.{service}.{device_id}.{event}"

devices:
  # vendor + device_kind select the adapter: registry key "<vendor>-<device_kind>".
  # "ntcip" is itself a vendor — the generic, standards-only implementation
  # (ADR 0003) that other ASC vendors start from.
  - id: asc-main-and-5th
    vendor: ntcip
    device_kind: asc
    poll_interval: 1s # optional
    connection: # opaque to the core — parsed only by the adapter
      snmp:
        address: 10.0.0.12:161 # host:port, required
        community: public # optional; defaults to "public"
